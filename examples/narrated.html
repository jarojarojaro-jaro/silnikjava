<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Silnik — explainer z lektorem</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=Caveat+Brush&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .stage { position: relative; }
    .start { position: absolute; inset: 0; display: grid; place-content: center; background: rgba(247, 243, 234, .7); border: 0; font: inherit; font-size: 34px; cursor: pointer; }
    .start span { background: #fffdf7; border: 2px solid var(--ink); border-radius: 16px; padding: 10px 26px; box-shadow: 3px 4px 0 rgba(0,0,0,.12); }
    .subs { position: absolute; left: 50%; bottom: 4%; transform: translateX(-50%); max-width: 80%; text-align: center; font-family: system-ui, sans-serif; font-size: clamp(13px, 1.9vw, 22px); line-height: 1.3; color: #fff; background: rgba(20, 20, 20, .72); padding: 4px 12px; border-radius: 6px; white-space: pre-line; pointer-events: none; }
    .subs:empty { display: none; }
  </style>
</head>
<body>
  <nav class="top"><a href="../index.html">← galeria</a><a href="explainer.html">explainer (bez głosu)</a></nav>
  <main class="wrap">
    <div class="card stage">
      <canvas id="c" aria-label="Rysowany film z lektorem: jak działa agent AI"></canvas>
      <div class="subs" id="subs" aria-live="polite"></div>
      <button class="start" id="start"><span>▶ odtwórz z dźwiękiem</span></button>
    </div>
    <div class="controls">
      <button class="btn" id="play">▶ odtwórz</button>
      <input type="range" id="seek" min="0" max="1" step="0.001" value="0" aria-label="Przewijanie" />
      <span class="time" id="time"></span>
      <label><input type="checkbox" id="cc" checked /> napisy</label>
      <a class="btn" id="srt" download="napisy.srt">⬇ napisy .srt</a>
    </div>
    <p style="color:var(--ink-soft);font-size:18px">Głos: lokalna synteza mowy (Piper, pl_PL-darkman). Znaczniki czasu słów z rozpoznawania mowy — ten sam mechanizm działa dla nagrania lektora.</p>
  </main>

  <script type="module">
    import { Player, Voice } from '../src/index.js';
    import { buildNarrated } from './scenes/narrated.js';

    const voice = await Voice.load('voice/agent/voice.json');
    const sb = buildNarrated(voice);
    const scene = sb.scene();
    const cues = sb.subtitles('cues');
    const $ = (id) => document.getElementById(id);
    let scrubbing = false;
    const player = new Player($('c'), scene, {
      trigger: 'manual',
      onTime: (t) => {
        $('time').textContent = `${Math.min(t, scene.duration).toFixed(1)} / ${scene.duration.toFixed(1)} s`;
        if (!scrubbing) $('seek').value = Math.min(1, t / scene.duration);
        const c = $('cc').checked ? cues.find((q) => t >= q.start && t <= q.end) : null;
        $('subs').textContent = c ? c.lines.join('\n') : '';
      },
    });
    window.__player = player;
    const srt = new Blob([sb.subtitles('srt')], { type: 'text/plain' });
    $('srt').href = URL.createObjectURL(srt);

    const sync = () => ($('play').textContent = player.playing ? '❚❚ pauza' : '▶ odtwórz');
    $('start').onclick = () => { $('start').remove(); player.seek(0); player.play(); sync(); };
    $('play').onclick = () => { $('start')?.remove(); player.toggle(); sync(); };
    $('seek').oninput = (e) => { scrubbing = true; player.pause(); player.seek(e.target.value * scene.duration); sync(); };
    $('seek').onchange = () => (scrubbing = false);
  </script>
</body>
</html>
