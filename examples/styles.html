<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Silnik — style</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=Caveat+Brush&family=Kalam:wght@400;700&family=Architects+Daughter&family=Courier+Prime&family=Patrick+Hand&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .tabs { display: flex; gap: 10px; flex-wrap: wrap; margin: 6px 0 14px; }
    .tabs a { text-decoration: none; }
    .tabs a[aria-current] { background: var(--ink); color: #fffdf7; }
    .stage { position: relative; padding: 0; overflow: hidden; }
    .start { position: absolute; inset: 0; display: grid; place-content: center; background: rgba(0, 0, 0, .35); border: 0; font: inherit; font-size: 34px; cursor: pointer; }
    .start span { background: #fffdf7; border: 2px solid var(--ink); border-radius: 16px; padding: 10px 26px; box-shadow: 3px 4px 0 rgba(0,0,0,.2); }
    .subs { position: absolute; left: 50%; bottom: 4%; transform: translateX(-50%); max-width: 80%; text-align: center; font-family: system-ui, sans-serif; font-size: clamp(13px, 1.9vw, 22px); line-height: 1.3; color: #fff; background: rgba(10, 10, 10, .72); padding: 4px 12px; border-radius: 6px; white-space: pre-line; pointer-events: none; }
    .subs:empty { display: none; }
    .about { color: var(--ink-soft); font-size: 19px; max-width: 70ch; }
  </style>
</head>
<body>
  <nav class="top"><a href="../index.html">← galeria</a><a href="narrated.html">z lektorem (papier)</a></nav>
  <main class="wrap">
    <div class="tabs" id="tabs"></div>
    <div class="card stage">
      <canvas id="c" aria-label="Rysowany film w wybranym stylu"></canvas>
      <div class="subs" id="subs" aria-live="polite"></div>
      <button class="start" id="start"><span>▶ odtwórz z dźwiękiem</span></button>
    </div>
    <div class="controls">
      <button class="btn" id="play">▶ odtwórz</button>
      <input type="range" id="seek" min="0" max="1" step="0.001" value="0" aria-label="Przewijanie" />
      <span class="time" id="time"></span>
      <label><input type="checkbox" id="cc" checked /> napisy</label>
    </div>
    <p class="about" id="about"></p>
  </main>

  <script type="module">
    import { Player, Voice } from '../src/index.js';
    import { buildChalk } from './scenes/styles/chalk.js';
    import { buildBlueprint } from './scenes/styles/blueprint.js';
    import { buildNeon } from './scenes/styles/neon.js';

    const STYLES = {
      chalk: { name: 'Tablica kredowa', build: buildChalk, about: 'Kreda na zielonej tablicy: ziarnista kreska, kolorowa kreda, w ręce kawałek kredy. Lekcja, matematyka, edukacja.' },
      blueprint: { name: 'Blueprint', build: buildBlueprint, about: 'Kalka techniczna: siatka, rapidograf o stałej grubości, kreślarskie przedłużenia linii, kreskowanie pod 45°, pismo techniczne. Architektura systemów, inżynieria, produkt.' },
      neon: { name: 'Neon (lightboard)', build: buildNeon, about: 'Pisanie na podświetlonej szybie: świecące kreski na prawie czarnym tle, pisak z poświatą. Technologia, AI, prezentacje.' },
    };
    const id = new URLSearchParams(location.search).get('s') in STYLES ? new URLSearchParams(location.search).get('s') : 'chalk';
    const $ = (x) => document.getElementById(x);
    $('tabs').innerHTML = Object.entries(STYLES).map(([k, s]) => `<a class="btn" href="?s=${k}" ${k === id ? 'aria-current="page"' : ''}>${s.name}</a>`).join('');
    $('about').textContent = STYLES[id].about;

    const voice = await Voice.load(`voice/${id}/voice.json`);
    const sb = STYLES[id].build(voice);
    const scene = sb.scene();
    const cues = sb.subtitles('cues');
    let scrubbing = false;
    const player = new Player($('c'), scene, {
      trigger: 'manual',
      onTime: (t) => {
        $('time').textContent = `${Math.min(t, scene.duration).toFixed(1)} / ${scene.duration.toFixed(1)} s`;
        if (!scrubbing) $('seek').value = Math.min(1, t / scene.duration);
        const c = $('cc').checked ? cues.find((q) => t >= q.start && t <= q.end) : null;
        $('subs').textContent = c ? c.lines.join('\n') : '';
      },
    });
    window.__player = player;
    window.__sb = sb;
    const sync = () => ($('play').textContent = player.playing ? '❚❚ pauza' : '▶ odtwórz');
    $('start').onclick = () => { $('start').remove(); player.seek(0); player.play(); sync(); };
    $('play').onclick = () => { $('start')?.remove(); player.toggle(); sync(); };
    $('seek').oninput = (e) => { scrubbing = true; player.pause(); player.seek(e.target.value * scene.duration); sync(); };
    $('seek').onchange = () => (scrubbing = false);
  </script>
</body>
</html>
